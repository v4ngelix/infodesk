plugins {
	id 'java'
	id 'idea'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ee.smit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Test).configureEach {
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'full'
		showStandardStreams = false
	}
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

idea {
	module {
		testSources.from(sourceSets.integrationTest.java.srcDirs)
		testResources.from(sourceSets.integrationTest.resources.srcDirs)
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests against the real OpenAI API. Requires OPENAI_API_KEY.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'integrationtest'
	reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/integrationTest')
	reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/integrationTest')
	shouldRunAfter tasks.named('test')

	def envKey = providers.environmentVariable('OPENAI_API_KEY')
	def dotEnv = providers.fileContents(layout.projectDirectory.file('.env')).asText
	doFirst {
		def fromEnv = envKey.getOrElse('').strip()
		def fromFile = dotEnv.getOrElse('').readLines()
				.findAll { it.startsWith('OPENAI_API_KEY=') }
				.collect { it.substring('OPENAI_API_KEY='.length()).strip() }
				.find { !it.isBlank() && it != 'sk-...' } ?: ''
		if (fromEnv.isBlank() && fromFile.isBlank()) {
			throw new GradleException('No OPENAI_API_KEY found in the environment or in .env. Integration tests call the real OpenAI API; set the key or run `./gradlew test` for unit tests only.')
		}
	}
}
